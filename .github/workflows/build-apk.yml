name: Build APK

on:
  push:
  workflow_dispatch:

env:
  JAVA_VERSION: "17"
  ANDROID_COMPILE_SDK: "34"
  ANDROID_BUILD_TOOLS: "34.0.0"

jobs:
  build-services:
    name: 📦 Services APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compute version metadata
        id: meta
        run: |
          SHORT_SHA=$(git rev-parse --short=4 HEAD)
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: "temurin"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses 2>&1 || true
      - name: Build services APK
        run: ./gradlew assembleServicesDebug -PserviceApiPort=7777 --no-daemon --stacktrace
      - name: Rename APK
        run: |
          APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -1)
          if [ -n "$APK_PATH" ]; then
            NEW_NAME="tomady-V${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.short_sha }}.apk"
            mv "$APK_PATH" "$(dirname "$APK_PATH")/$NEW_NAME"
            echo "Renamed to $NEW_NAME"
          else
            echo "No APK found to rename"
          fi
      - name: Diagnostic
        if: always()
        run: |
          {
            echo "=== ANDROID_HOME ==="
            echo "$ANDROID_HOME"
            echo "=== SDK packages ==="
            sdkmanager --list_installed 2>&1 || true
            echo "=== build.gradle.kts ==="
            cat app/build.gradle.kts
            echo "=== FIND all build outputs ==="
            find app/build -type f -name "*.apk" -o -name "*.aab" -o -name "*.ap_" 2>/dev/null || echo "NO APK/AAB/AP_ found"
            echo "=== FIND outputs dir ==="
            find app/build/outputs -type f 2>/dev/null | head -100 || echo "No outputs dir"
            echo "=== ls -laR app/build/outputs/apk ==="
            ls -laR app/build/outputs/apk/ 2>/dev/null || echo "No apk dir exists"
            echo "=== ls -laR app/build/intermediates/apk ==="
            find app/build/intermediates -type f -name "*.apk" 2>/dev/null | head -20 || echo "No intermediates apk"
          } > diagnostic.txt 2>&1
      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostic
          path: diagnostic.txt
          if-no-files-found: warn
      - name: Upload services APK
        uses: actions/upload-artifact@v4
        with:
          name: tomady-services-${{ steps.meta.outputs.short_sha }}
          path: app/build/outputs/apk/**/*.apk
          compression-level: 0
          if-no-files-found: warn

  build-full:
    name: 🎨 Full (UI) APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compute version metadata
        id: meta
        run: |
          SHORT_SHA=$(git rev-parse --short=4 HEAD)
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: "temurin"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses 2>&1 || true
      - name: Build full (UI) APK
        run: ./gradlew assembleFullDebug -PserviceApiPort=7777 --no-daemon --stacktrace
      - name: Rename APK
        run: |
          APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -1)
          if [ -n "$APK_PATH" ]; then
            NEW_NAME="tomady-V${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.short_sha }}.apk"
            mv "$APK_PATH" "$(dirname "$APK_PATH")/$NEW_NAME"
            echo "Renamed to $NEW_NAME"
          else
            echo "No APK found to rename"
          fi
      - name: Diagnostic
        if: always()
        run: |
          {
            echo "=== ANDROID_HOME ==="
            echo "$ANDROID_HOME"
            echo "=== SDK packages ==="
            sdkmanager --list_installed 2>&1 || true
            echo "=== build.gradle.kts ==="
            cat app/build.gradle.kts
            echo "=== FIND all build outputs ==="
            find app/build -type f -name "*.apk" -o -name "*.aab" -o -name "*.ap_" 2>/dev/null || echo "NO APK/AAB/AP_ found"
            echo "=== FIND outputs dir ==="
            find app/build/outputs -type f 2>/dev/null | head -100 || echo "No outputs dir"
            echo "=== ls -laR app/build/outputs/apk ==="
            ls -laR app/build/outputs/apk/ 2>/dev/null || echo "No apk dir exists"
            echo "=== ls -laR app/build/intermediates/apk ==="
            find app/build/intermediates -type f -name "*.apk" 2>/dev/null | head -20 || echo "No intermediates apk"
          } > diagnostic.txt 2>&1
      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-full-diagnostic
          path: diagnostic.txt
          if-no-files-found: warn
      - name: Upload full (UI) APK
        uses: actions/upload-artifact@v4
        with:
          name: tomady-full-${{ steps.meta.outputs.short_sha }}
          path: app/build/outputs/apk/**/*.apk
          compression-level: 0
          if-no-files-found: warn

name: Build APK

on:
  push:
  workflow_dispatch:

env:
  JAVA_VERSION: "17"
  ANDROID_COMPILE_SDK: "34"
  ANDROID_BUILD_TOOLS: "34.0.0"

jobs:
  build-services:
    name: 📦 Services APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: "temurin"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install build tools and platform
        run: |
          sdkmanager --install "platforms;android-${{ env.ANDROID_COMPILE_SDK }}" "build-tools;${{ env.ANDROID_BUILD_TOOLS }}" 2>&1 || true
          yes | sdkmanager --licenses 2>&1 || true
      - name: Build services APK
        run: ./gradlew assembleServicesDebug -PserviceApiPort=7777 --no-daemon --stacktrace 2>&1 | tee build-log.txt
      - name: Print build output
        if: always()
        run: |
          echo "=== Last 100 lines of build log ==="
          tail -100 build-log.txt 2>/dev/null || true
          echo "=== APK output directory ==="
          find app/build/outputs -name "*.apk" 2>/dev/null || echo "No APK files found"
          echo "=== Build outputs tree ==="
          ls -la app/build/outputs/ 2>/dev/null || echo "No outputs directory"
          ls -la app/build/outputs/apk/ 2>/dev/null || echo "No apk directory"
          ls -laR app/build/outputs/apk/services/ 2>/dev/null || echo "No services apk directory"
      - name: Upload services APK
        uses: actions/upload-artifact@v4
        with:
          name: tomady-services-debug
          path: app/build/outputs/apk/**/*.apk
          compression-level: 0
          if-no-files-found: warn

  build-demo:
    name: 🖥️ Demo GUI APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: "temurin"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install build tools and platform
        run: |
          sdkmanager --install "platforms;android-${{ env.ANDROID_COMPILE_SDK }}" "build-tools;${{ env.ANDROID_BUILD_TOOLS }}" 2>&1 || true
          yes | sdkmanager --licenses 2>&1 || true
      - name: Build demo APK
        run: ./gradlew assembleDemoDebug -PserviceApiPort=7777 --no-daemon --stacktrace 2>&1 | tee build-log.txt
      - name: Print build output
        if: always()
        run: |
          echo "=== Last 100 lines of build log ==="
          tail -100 build-log.txt 2>/dev/null || true
          find app/build/outputs -name "*.apk" 2>/dev/null || echo "No APK files found"
      - name: Upload demo APK
        uses: actions/upload-artifact@v4
        with:
          name: tomady-demo-debug
          path: app/build/outputs/apk/**/*.apk
          compression-level: 0
          if-no-files-found: warn

  build-full:
    name: 🧩 Full APK (both)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: "temurin"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install build tools and platform
        run: |
          sdkmanager --install "platforms;android-${{ env.ANDROID_COMPILE_SDK }}" "build-tools;${{ env.ANDROID_BUILD_TOOLS }}" 2>&1 || true
          yes | sdkmanager --licenses 2>&1 || true
      - name: Build full APK
        run: ./gradlew assembleFullDebug -PserviceApiPort=7777 --no-daemon --stacktrace 2>&1 | tee build-log.txt
      - name: Print build output
        if: always()
        run: |
          echo "=== Last 100 lines of build log ==="
          tail -100 build-log.txt 2>/dev/null || true
          find app/build/outputs -name "*.apk" 2>/dev/null || echo "No APK files found"
      - name: Upload full APK
        uses: actions/upload-artifact@v4
        with:
          name: tomady-full-debug
          path: app/build/outputs/apk/**/*.apk
          compression-level: 0
          if-no-files-found: warn

name: Build APK

on:
  push:
  workflow_dispatch:

env:
  JAVA_VERSION: "17"
  ANDROID_COMPILE_SDK: "34"
  ANDROID_BUILD_TOOLS: "34.0.0"

jobs:
  build-services:
    name: 📦 Services APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: "temurin"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: ${{ env.ANDROID_COMPILE_SDK }}
          build-tools: ${{ env.ANDROID_BUILD_TOOLS }}
      - name: Ensure cmdline-tools + accept licenses
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          if [ -x "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          elif [ -x "${ANDROID_SDK_ROOT}/tools/bin/sdkmanager" ]; then
            yes | "${ANDROID_SDK_ROOT}/tools/bin/sdkmanager" --licenses || true
          else
            echo "sdkmanager not found; continuing (runner may already have SDK)."
          fi
      - name: Build services APK
        - name: Verify repo and strings resource
        run: |
          echo "Branch: $(git rev-parse --abbrev-ref HEAD)"
          echo "Commit: $(git rev-parse HEAD)"
          git ls-files | grep app/src/main/res/values/strings.xml || true
          ls -l app/src/main/res || true
          cat app/src/main/res/values/strings.xml || true
      - name: Build services APK
        run: ./gradlew assembleServicesDebug -PserviceApiPort=7777 --no-daemon --stacktrace
      - name: Upload services APK
        uses: actions/upload-artifact@v4
        with:
          name: tomady-services-debug
          path: app/build/outputs/apk/services/debug/*.apk
          compression-level: 0
          if-no-files-found: warn

  build-demo:
    name: 🖥️ Demo GUI APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: "temurin"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: ${{ env.ANDROID_COMPILE_SDK }}
          build-tools: ${{ env.ANDROID_BUILD_TOOLS }}
      - name: Ensure cmdline-tools + accept licenses
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          if [ -x "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          elif [ -x "${ANDROID_SDK_ROOT}/tools/bin/sdkmanager" ]; then
            yes | "${ANDROID_SDK_ROOT}/tools/bin/sdkmanager" --licenses || true
          else
            echo "sdkmanager not found; continuing (runner may already have SDK)."
          fi
      - name: Build demo APK
        - name: Verify repo and strings resource
        run: |
          echo "Branch: $(git rev-parse --abbrev-ref HEAD)"
          echo "Commit: $(git rev-parse HEAD)"
          git ls-files | grep app/src/main/res/values/strings.xml || true
          ls -l app/src/main/res || true
          cat app/src/main/res/values/strings.xml || true
      - name: Build demo APK
        run: ./gradlew assembleDemoDebug -PserviceApiPort=7777 --no-daemon --stacktrace
      - name: Upload demo APK
        uses: actions/upload-artifact@v4
        with:
          name: tomady-demo-debug
          path: app/build/outputs/apk/demo/debug/*.apk
          compression-level: 0
          if-no-files-found: warn

  build-full:
    name: 🧩 Full APK (both)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: "temurin"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: ${{ env.ANDROID_COMPILE_SDK }}
          build-tools: ${{ env.ANDROID_BUILD_TOOLS }}
      - name: Ensure cmdline-tools + accept licenses
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          if [ -x "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          elif [ -x "${ANDROID_SDK_ROOT}/tools/bin/sdkmanager" ]; then
            yes | "${ANDROID_SDK_ROOT}/tools/bin/sdkmanager" --licenses || true
          else
            echo "sdkmanager not found; continuing (runner may already have SDK)."
          fi
      - name: Build full APK
        - name: Verify repo and strings resource
        run: |
          echo "Branch: $(git rev-parse --abbrev-ref HEAD)"
          echo "Commit: $(git rev-parse HEAD)"
          git ls-files | grep app/src/main/res/values/strings.xml || true
          ls -l app/src/main/res || true
          cat app/src/main/res/values/strings.xml || true
      - name: Build full APK
        run: ./gradlew assembleFullDebug -PserviceApiPort=7777 --no-daemon --stacktrace
      - name: Upload full APK
        uses: actions/upload-artifact@v4
        with:
          name: tomady-full-debug
          path: app/build/outputs/apk/full/debug/*.apk
          compression-level: 0
          if-no-files-found: warn

name: Build APK

on:
  push:
  workflow_dispatch:

env:
  JAVA_VERSION: "17"
  ANDROID_COMPILE_SDK: "34"
  ANDROID_BUILD_TOOLS: "34.0.0"
  NODE_VERSION: "20"

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      # ── Checkout ────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Set up Java 17 ───────────────────────────────────────────────
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: "temurin"

      # ── Set up Android SDK ────────────────────────────────────────────
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: ${{ env.ANDROID_COMPILE_SDK }}
          build-tools: ${{ env.ANDROID_BUILD_TOOLS }}

      # ── Set up Node.js (for React Native JS bundling) ────────────────
      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # ── Build services-only APK first (no RN bundle needed) ─────────
      - name: Build services-only APK
        run: |
          ./gradlew assembleServicesDebug --no-daemon --stacktrace

      # ── Install demo RN dependencies ─────────────────────────────────
      - name: Install demo dependencies
        working-directory: ./demo
        run: npm install

      # ── Bundle React Native JS ───────────────────────────────────────
      - name: Bundle React Native JS (Android)
        working-directory: ./demo
        run: |
          mkdir -p /tmp/rn-bundle
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output /tmp/rn-bundle/index.android.bundle \
            --assets-dest /tmp/rn-bundle/res/

      # ── Copy RN bundle into flavor-specific asset directories ────────
      - name: Copy RN bundle to demo flavor assets
        run: |
          mkdir -p app/src/demo/assets
          cp /tmp/rn-bundle/index.android.bundle app/src/demo/assets/
          cp -r /tmp/rn-bundle/res/* app/src/demo/res/ 2>/dev/null || true

      - name: Copy RN bundle to full flavor assets
        run: |
          mkdir -p app/src/full/assets
          cp /tmp/rn-bundle/index.android.bundle app/src/full/assets/
          cp -r /tmp/rn-bundle/res/* app/src/full/res/ 2>/dev/null || true

      # ── Build remaining APK flavors (with RN bundle) ─────────────────
      - name: Build demo and full APKs
        run: |
          ./gradlew \
            assembleDemoDebug \
            assembleFullDebug \
            --no-daemon --stacktrace

      # ── Upload APKs ──────────────────────────────────────────────────
      - name: Upload services-only APK
        uses: actions/upload-artifact@v4
        with:
          name: tomady-services-debug
          path: app/build/outputs/apk/services/debug/*.apk
          compression-level: 0
          if-no-files-found: error

      - name: Upload demo GUI APK
        uses: actions/upload-artifact@v4
        with:
          name: tomady-demo-debug
          path: app/build/outputs/apk/demo/debug/*.apk
          compression-level: 0
          if-no-files-found: error

      - name: Upload full (both) APK
        uses: actions/upload-artifact@v4
        with:
          name: tomady-full-debug
          path: app/build/outputs/apk/full/debug/*.apk
          compression-level: 0
          if-no-files-found: error

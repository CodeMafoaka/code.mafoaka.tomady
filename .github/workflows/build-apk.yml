name: Build APK

on:
  push:
  workflow_dispatch:

env:
  JAVA_VERSION: "17"
  ANDROID_COMPILE_SDK: "34"
  ANDROID_BUILD_TOOLS: "34.0.0"

jobs:
  build-services:
    name: 📦 Services APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: "temurin"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Accept SDK licenses and list installed packages
        run: |
          yes | sdkmanager --licenses 2>&1 || true
          sdkmanager --list_installed 2>&1 || sdkmanager --list 2>&1 | head -30 || true
      - name: Build services APK
        run: ./gradlew assembleServicesDebug -PserviceApiPort=7777 --no-daemon --info 2>&1 | tee build-log.txt
      - name: Diagnostic — find all outputs
        if: always()
        run: |
          echo "=== FIND APK FILES ==="
          find app/build -name "*.apk" -o -name "*.aab" 2>/dev/null || echo "No APK/AAB found"
          echo "=== FIND outputs directory ==="
          find app/build/outputs -type f 2>/dev/null | head -50 || echo "No outputs directory"
          echo "=== LAST 80 LINES OF BUILD LOG ==="
          tail -80 build-log.txt 2>/dev/null || true
      - name: Upload services APK
        uses: actions/upload-artifact@v4
        with:
          name: tomady-services-debug
          path: |
            app/build/outputs/apk/**/*.apk
            app/build/outputs/apk/*.apk
          compression-level: 0
          if-no-files-found: warn
